<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollie - Your Strategic Partner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #e0e0e0;
        }

        /* Ambient particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        /* Avatar Container */
        .avatar-container {
            position: relative;
            z-index: 1;
            margin-bottom: 30px;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a2e;
            padding: 15px 20px;
            border-radius: 20px;
            max-width: 300px;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .speech-bubble.active {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.95) transparent transparent;
        }

        /* Owl SVG Styles */
        .owl-wrapper {
            width: 250px;
            height: 280px;
            position: relative;
        }

        .owl-body {
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .owl-eye {
            animation: blink 4s infinite;
            transform-origin: center;
        }

        @keyframes blink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }

        .owl-wing-left, .owl-wing-right {
            animation: wingFlap 5s ease-in-out infinite;
            transform-origin: center;
        }

        .owl-wing-left { animation-delay: 0s; }
        .owl-wing-right { animation-delay: 0.5s; }

        @keyframes wingFlap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
        }

        .glow-ring {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        /* Chat Interface */
        .chat-interface {
            z-index: 1;
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .chat-header h2 {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .chat-messages {
            height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.3);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: rgba(255, 215, 0, 0.2);
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .message.ollie {
            background: rgba(255, 255, 255, 0.15);
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        .typing-indicator {
            display: none;
            padding: 8px 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
        }

        .typing-indicator.active {
            display: block;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: background 0.3s;
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .chat-input:focus {
            background: rgba(255, 255, 255, 0.25);
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Status indicator */
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Ambient particles -->
    <div class="particles" id="particles"></div>

    <!-- Avatar Container -->
    <div class="avatar-container">
        <!-- Speech Bubble -->
        <div class="speech-bubble" id="speechBubble">
            Hey, I'm Ollie. Ready when you are.
        </div>

        <!-- Owl SVG Avatar -->
        <div class="owl-wrapper">
            <svg viewBox="0 0 250 280" xmlns="http://www.w3.org/2000/svg">
                <!-- Glow ring -->
                <circle class="glow-ring" cx="125" cy="130" r="110" fill="none" stroke="rgba(255,215,0,0.2)" stroke-width="2"/>
                <circle class="glow-ring" cx="125" cy="130" r="95" fill="none" stroke="rgba(255,215,0,0.1)" stroke-width="1" style="animation-delay: 0.5s;"/>
                
                <!-- Owl Body Group -->
                <g class="owl-body">
                    <!-- Main body -->
                    <ellipse cx="125" cy="160" rx="75" ry="85" fill="#2c3e50"/>
                    <ellipse cx="125" cy="160" rx="70" ry="80" fill="#34495e"/>
                    
                    <!-- Belly -->
                    <ellipse cx="125" cy="175" rx="50" ry="55" fill="#4a5f7a"/>
                    
                    <!-- Wings -->
                    <g class="owl-wing-left">
                        <ellipse cx="55" cy="160" rx="25" ry="45" fill="#2c3e50" transform="rotate(-15 55 160)"/>
                    </g>
                    <g class="owl-wing-right">
                        <ellipse cx="195" cy="160" rx="25" ry="45" fill="#2c3e50" transform="rotate(15 195 160)"/>
                    </g>
                    
                    <!-- Face/Head -->
                    <circle cx="125" cy="100" r="60" fill="#34495e"/>
                    <circle cx="125" cy="100" r="55" fill="#4a5f7a"/>
                    
                    <!-- Eyes background -->
                    <circle cx="105" cy="95" r="22" fill="#1a1a2e"/>
                    <circle cx="145" cy="95" r="22" fill="#1a1a2e"/>
                    
                    <!-- Eyes (with blink animation) -->
                    <g class="owl-eye">
                        <circle cx="105" cy="95" r="18" fill="#ffd700"/>
                        <circle cx="145" cy="95" r="18" fill="#ffd700"/>
                        <!-- Pupils -->
                        <circle cx="105" cy="95" r="10" fill="#1a1a2e"/>
                        <circle cx="145" cy="95" r="10" fill="#1a1a2e"/>
                        <!-- Shine -->
                        <circle cx="108" cy="92" r="4" fill="rgba(255,255,255,0.8)"/>
                        <circle cx="148" cy="92" r="4" fill="rgba(255,255,255,0.8)"/>
                    </g>
                    
                    <!-- Beak -->
                    <path d="M 125 110 L 118 125 L 125 135 L 132 125 Z" fill="#ff9500"/>
                    
                    <!-- Eyebrows -->
                    <path d="M 85 70 Q 105 65 115 75" stroke="#2c3e50" stroke-width="3" fill="none"/>
                    <path d="M 135 75 Q 145 65 165 70" stroke="#2c3e50" stroke-width="3" fill="none"/>
                    
                    <!-- Ears/tufts -->
                    <path d="M 75 55 L 65 30 L 90 50 Z" fill="#2c3e50"/>
                    <path d="M 175 55 L 185 30 L 160 50 Z" fill="#2c3e50"/>
                    
                    <!-- Feet -->
                    <ellipse cx="95" cy="245" rx="15" ry="8" fill="#ff9500"/>
                    <ellipse cx="155" cy="245" rx="15" ry="8" fill="#ff9500"/>
                </g>
                
                <!-- Name badge -->
                <rect x="85" y="255" width="80" height="24" rx="12" fill="rgba(255,215,0,0.2)" stroke="rgba(255,215,0,0.5)" stroke-width="1"/>
                <text x="125" y="271" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold" font-family="Segoe UI, sans-serif">OLLIE</text>
            </svg>
        </div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-interface">
        <div class="chat-header">
            <h2>🦉 Ollie</h2>
            <p>Strategic Business Partner</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ollie">Hey Bass, I'm here. What's on your mind today?</div>
        </div>
        <div class="typing-indicator" id="typingIndicator">Ollie is thinking...</div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Type your message..." autocomplete="off">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <!-- Status -->
    <div class="status">
        <div class="status-dot"></div>
        <span>Online</span>
    </div>

    <script>
        // Create ambient particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (10 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Chat functionality
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const typingIndicator = document.getElementById('typingIndicator');
        const speechBubble = document.getElementById('speechBubble');

        const ollieResponses = [
            "I've been reviewing our priorities. What's the most urgent item on your list?",
            "Good point. Let me think through the implications of that...",
            "From a strategic perspective, that aligns well with the £10M goal.",
            "Have you considered the compliance angle on this?",
            "That's exactly the kind of thinking that moves the needle.",
            "Want me to dig into the numbers on that?",
            "Smart. Let's keep that in the active pipeline.",
            "I like where this is heading. What's the next step?",
            "Let me flag that for our next review session.",
            "That's a solid approach. No fluff, just execution."
        ];

        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.textContent = text;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.add('active');
        }

        function hideTyping() {
            typingIndicator.classList.remove('active');
        }

        function showSpeechBubble(text) {
            speechBubble.textContent = text;
            speechBubble.classList.add('active');
            setTimeout(() => {
                speechBubble.classList.remove('active');
            }, 4000);
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatInput.value = '';

            showTyping();

            setTimeout(() => {
                hideTyping();
                const response = ollieResponses[Math.floor(Math.random() * ollieResponses.length)];
                addMessage(response, 'ollie');
                showSpeechBubble(response);
            }, 1500 + Math.random() * 1000);
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Welcome animation
        setTimeout(() => {
            showSpeechBubble("Hey, I'm Ollie. Ready when you are.");
        }, 1000);

        // Make functions available for external calls
        window.sendToOllie = function(text) {
            chatInput.value = text;
            sendMessage();
        };

        window.ollieSay = function(text) {
            addMessage(text, 'ollie');
            showSpeechBubble(text);
        };
    </script>
</body>
</html>
