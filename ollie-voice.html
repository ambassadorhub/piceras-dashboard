<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollie Voice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* Avatar */
        .avatar-wrap {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            position: relative;
            transition: all 0.3s ease;
        }

        .avatar.speaking {
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            animation: pulse 0.8s ease-in-out infinite alternate;
        }

        .avatar.listening {
            border-color: #4ade80;
            box-shadow: 0 0 50px rgba(74, 222, 128, 0.2);
        }

        .avatar.thinking {
            border-color: #64c8ff;
            box-shadow: 0 0 50px rgba(100, 200, 255, 0.2);
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        /* Wave rings */
        .ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.1);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ring.active {
            opacity: 1;
            animation: ringExpand 2s ease-out infinite;
        }

        @keyframes ringExpand {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        /* Status */
        .status {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            min-height: 20px;
            text-align: center;
        }

        .status.listening { color: #4ade80; }
        .status.speaking { color: #ffd700; }
        .status.thinking { color: #64c8ff; }

        /* Transcript */
        .transcript {
            font-size: 18px;
            text-align: center;
            min-height: 54px;
            max-width: 100%;
            color: #fff;
            line-height: 1.5;
            padding: 0 20px;
        }

        .transcript.dim {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Mic button */
        .mic-wrap {
            position: relative;
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #1a1a2e;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .mic-btn:hover {
            transform: scale(1.05);
        }

        .mic-btn:active {
            transform: scale(0.95);
        }

        .mic-btn.listening {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.4);
            animation: micPulse 1s ease-in-out infinite;
        }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Voice waves */
        .waves {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
            align-items: center;
            height: 30px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .waves.active {
            opacity: 1;
        }

        .wave {
            width: 3px;
            background: #ffd700;
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        /* Hint */
        .hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Avatar -->
        <div class="avatar-wrap">
            <div class="ring" id="ring1"></div>
            <div class="ring" id="ring2" style="animation-delay: 0.7s;"></div>
            <div class="avatar" id="avatar">
                🦉
            </div>
            <div class="waves" id="waves">
                <div class="wave" style="height: 8px;"></div>
                <div class="wave" style="height: 15px;"></div>
                <div class="wave" style="height: 22px;"></div>
                <div class="wave" style="height: 18px;"></div>
                <div class="wave" style="height: 12px;"></div>
            </div>
        </div>

        <!-- Status -->
        <div class="status" id="status">Tap and hold to speak</div>

        <!-- Transcript -->
        <div class="transcript" id="transcript"></div>

        <!-- Mic Button -->
        <div class="mic-wrap">
            <button class="mic-btn" id="micBtn">🎤</button>
        </div>

        <div class="hint">
            Requires Chrome with microphone access
        </div>
    </div>

    <script>
        // Check browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;

        if (!SpeechRecognition) {
            document.getElementById('status').textContent = 'Voice not supported in this browser';
            document.getElementById('micBtn').style.display = 'none';
        }

        // Elements
        const avatar = document.getElementById('avatar');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const micBtn = document.getElementById('micBtn');
        const waves = document.getElementById('waves');
        const ring1 = document.getElementById('ring1');
        const ring2 = document.getElementById('ring2');

        let recognition = null;
        let isListening = false;
        let isSpeaking = false;

        // Demo responses
        const responses = [
            "I've been reviewing our priorities. What's the most urgent item on your list?",
            "Good point. Let me think through the implications of that...",
            "From a strategic perspective, that aligns well with the £10M goal.",
            "Have you considered the compliance angle on this?",
            "That's exactly the kind of thinking that moves the needle.",
            "Want me to dig into the numbers on that?",
            "Smart. Let's keep that in the active pipeline.",
            "I like where this is heading. What's the next step?",
            "Let me flag that for our next review session.",
            "That's a solid approach. No fluff, just execution."
        ];

        // Initialize speech recognition
        function initSpeech() {
            const rec = new SpeechRecognition();
            rec.continuous = false;
            rec.interimResults = true;
            rec.lang = 'en-GB';

            rec.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                avatar.className = 'avatar listening';
                status.textContent = 'Listening...';
                status.className = 'status listening';
                waves.classList.add('active');
                ring1.classList.add('active');
                ring2.classList.add('active');
                transcript.textContent = '';
            };

            rec.onresult = (event) => {
                const text = Array.from(event.results)
                    .map(r => r[0].transcript)
                    .join('');
                
                transcript.textContent = text;

                if (event.results[0].isFinal) {
                    handleInput(text);
                }
            };

            rec.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'no-speech') {
                    status.textContent = 'No speech detected';
                } else if (event.error === 'audio-capture') {
                    status.textContent = 'No microphone found';
                } else if (event.error === 'not-allowed') {
                    status.textContent = 'Microphone permission denied';
                } else {
                    status.textContent = 'Error: ' + event.error;
                }
                resetState();
            };

            rec.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                if (!isSpeaking) {
                    resetState();
                }
            };

            return rec;
        }

        if (SpeechRecognition) {
            recognition = initSpeech();
        }

        // Handle user input
        function handleInput(text) {
            transcript.classList.add('dim');
            
            // Show thinking state
            avatar.className = 'avatar thinking';
            status.textContent = 'Ollie is thinking...';
            status.className = 'status thinking';
            waves.classList.remove('active');
            ring1.classList.remove('active');
            ring2.classList.remove('active');

            // Simulate AI processing delay
            setTimeout(() => {
                const response = responses[Math.floor(Math.random() * responses.length)];
                speakResponse(response);
            }, 1200 + Math.random() * 800);
        }

        // Speak response
        function speakResponse(text) {
            isSpeaking = true;
            
            avatar.className = 'avatar speaking';
            status.textContent = 'Speaking...';
            status.className = 'status speaking';
            waves.classList.add('active');

            // Update transcript to show response
            transcript.textContent = text;
            transcript.classList.remove('dim');

            // Use browser TTS
            if (synth) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.95;
                utterance.pitch = 1;
                utterance.lang = 'en-GB';
                
                // Try to find a decent voice
                const voices = synth.getVoices();
                const preferredVoice = voices.find(v => 
                    v.name.includes('Google UK English Male') || 
                    v.name.includes('Daniel') ||
                    v.name.includes('British') ||
                    v.name.includes('UK')
                );
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }

                utterance.onend = () => {
                    isSpeaking = false;
                    resetState();
                };

                synth.speak(utterance);
            } else {
                setTimeout(() => {
                    isSpeaking = false;
                    resetState();
                }, 3000);
            }
        }

        // Reset state
        function resetState() {
            avatar.className = 'avatar';
            status.textContent = 'Tap and hold to speak';
            status.className = 'status';
            waves.classList.remove('active');
            ring1.classList.remove('active');
            ring2.classList.remove('active');
            transcript.textContent = '';
            transcript.classList.remove('dim');
        }

        // Mic button handlers
        micBtn.addEventListener('mousedown', startListening);
        micBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startListening();
        });

        micBtn.addEventListener('mouseup', stopListening);
        micBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopListening();
        });

        micBtn.addEventListener('mouseleave', () => {
            if (isListening) stopListening();
        });

        function startListening() {
            if (!recognition || isSpeaking) return;
            
            try {
                recognition.start();
            } catch (e) {
                // Already started or error
                recognition = initSpeech();
                recognition.start();
            }
        }

        function stopListening() {
            if (!recognition) return;
            
            try {
                recognition.stop();
            } catch (e) {
                // Not started
            }
        }

        // Animate waves randomly
        setInterval(() => {
            if (waves.classList.contains('active')) {
                document.querySelectorAll('.wave').forEach(bar => {
                    bar.style.height = (8 + Math.random() * 20) + 'px';
                });
            }
        }, 100);

        // Load voices
        if (synth) {
            synth.onvoiceschanged = () => {
                console.log('Voices loaded:', synth.getVoices().length);
            };
        }

        // Welcome
        setTimeout(() => {
            speakResponse("Hey Bass, I'm Ollie. Tap and hold the microphone to talk to me.");
        }, 500);
    </script>
</body>
</html>
