<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollie - Voice Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #141420 50%, #0d1b2a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            color: #e0e0e0;
        }

        .avatar-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .avatar-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .avatar-glow {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .avatar-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .avatar-circle.speaking {
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            animation: speakingPulse 0.5s ease-in-out infinite alternate;
        }

        .avatar-circle.thinking {
            border-color: rgba(100, 200, 255, 0.5);
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.2);
        }

        @keyframes speakingPulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .wave-container {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            align-items: center;
            height: 40px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .wave-container.active {
            opacity: 1;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, #ffd700, #ff9500);
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .status-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .status-text.listening { color: #4ade80; }
        .status-text.speaking { color: #ffd700; }
        .status-text.thinking { color: #64c8ff; }

        .conversation {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 20px;
        }

        .chat-bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            max-width: 80%;
            animation: bubbleIn 0.3s ease;
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-bubble.user {
            background: rgba(255, 215, 0, 0.15);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.ollie {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .mic-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #1a1a2e;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }

        .mic-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.5);
        }

        .mic-btn.listening {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.4);
            animation: micPulse 1s ease-in-out infinite;
        }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .text-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .text-btn:hover {
            border-color: rgba(255, 215, 0, 0.5);
            color: #ffd700;
        }

        .text-modal {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 90%;
            max-width: 500px;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .text-modal.active {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }

        .text-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .text-input::placeholder { color: rgba(255, 255, 255, 0.4); }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: #ffd700;
            color: #1a1a2e;
            font-size: 18px;
            cursor: pointer;
        }

        .thinking-dots {
            display: none;
            gap: 4px;
        }

        .thinking-dots.active { display: flex; }

        .dot {
            width: 8px;
            height: 8px;
            background: #64c8ff;
            border-radius: 50%;
            animation: dotBounce 0.6s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="avatar-section">
        <div class="avatar-container">
            <div class="avatar-glow"></div>
            <div class="avatar-circle" id="avatarCircle">
                <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Glow -->
                    <circle cx="60" cy="60" r="55" fill="url(#glow)" opacity="0.3"/>
                    <!-- Head -->
                    <circle cx="60" cy="55" r="40" fill="#2c3e50"/>
                    <circle cx="60" cy="55" r="35" fill="#34495e"/>
                    <!-- Eyes -->
                    <circle cx="48" cy="50" r="12" fill="#1a1a2e"/>
                    <circle cx="72" cy="50" r="12" fill="#1a1a2e"/>
                    <circle cx="48" cy="50" r="9" fill="#ffd700" class="eye"/>
                    <circle cx="72" cy="50" r="9" fill="#ffd700" class="eye"/>
                    <circle cx="48" cy="50" r="5" fill="#1a1a2e"/>
                    <circle cx="72" cy="50" r="5" fill="#1a1a2e"/>
                    <circle cx="50" cy="48" r="2" fill="white" opacity="0.8"/>
                    <circle cx="74" cy="48" r="2" fill="white" opacity="0.8"/>
                    <!-- Beak -->
                    <path d="M60 60 L55 70 L60 78 L65 70 Z" fill="#ff9500"/>
                    <!-- Body -->
                    <ellipse cx="60" cy="95" rx="30" ry="25" fill="#2c3e50"/>
                    <ellipse cx="60" cy="95" rx="25" ry="20" fill="#34495e"/>
                    <!-- Ears -->
                    <path d="M25 25 L20 10 L35 20 Z" fill="#2c3e50"/>
                    <path d="M95 25 L100 10 L85 20 Z" fill="#2c3e50"/>
                    <defs>
                        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
                            <stop offset="0%" stop-color="#ffd700" stop-opacity="0.5"/>
                            <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                </svg>
            </div>
            <div class="wave-container" id="waveContainer">
                <div class="wave-bar" style="height: 10px;"></div>
                <div class="wave-bar" style="height: 20px;"></div>
                <div class="wave-bar" style="height: 30px;"></div>
                <div class="wave-bar" style="height: 25px;"></div>
                <div class="wave-bar" style="height: 15px;"></div>
                <div class="wave-bar" style="height: 30px;"></div>
                <div class="wave-bar" style="height: 20px;"></div>
                <div class="wave-bar" style="height: 10px;"></div>
            </div>
        </div>
        
        <div class="status-text" id="statusText">Tap microphone to talk</div>
        <div class="thinking-dots" id="thinkingDots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="conversation" id="conversation"></div>

    <div class="text-modal" id="textModal">
        <input type="text" class="text-input" id="textInput" placeholder="Type your message...">
        <button class="send-btn" id="sendBtn">➤</button>
    </div>

    <div class="controls">
        <button class="text-btn" id="textBtn" title="Type message">⌨️</button>
        <button class="mic-btn" id="micBtn" title="Hold to speak">🎤</button>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const SpeechSynthesis = window.speechSynthesis;

        const avatarCircle = document.getElementById('avatarCircle');
        const waveContainer = document.getElementById('waveContainer');
        const statusText = document.getElementById('statusText');
        const micBtn = document.getElementById('micBtn');
        const textBtn = document.getElementById('textBtn');
        const textModal = document.getElementById('textModal');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const conversation = document.getElementById('conversation');
        const thinkingDots = document.getElementById('thinkingDots');

        let recognition = null;
        let isListening = false;

        // Demo responses
        const responses = [
            "I've been reviewing our priorities. What's the most urgent item on your list?",
            "Good point. Let me think through the implications of that...",
            "From a strategic perspective, that aligns well with the £10M goal.",
            "Have you considered the compliance angle on this?",
            "That's exactly the kind of thinking that moves the needle.",
            "Want me to dig into the numbers on that?",
            "Smart. Let's keep that in the active pipeline.",
            "I like where this is heading. What's the next step?",
            "Let me flag that for our next review session.",
            "That's a solid approach. No fluff, just execution."
        ];

        function initSpeechRecognition() {
            if (!SpeechRecognition) {
                statusText.textContent = 'Speech not supported - use text';
                return null;
            }

            const rec = new SpeechRecognition();
            rec.continuous = false;
            rec.interimResults = true;
            rec.lang = 'en-GB';

            rec.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                avatarCircle.classList.add('speaking');
                statusText.textContent = 'Listening...';
                statusText.classList.add('listening');
                waveContainer.classList.add('active');
            };

            rec.onresult = (event) => {
                const transcript = Array.from(event.results)
                    .map(r => r[0].transcript)
                    .join('');
                
                statusText.textContent = transcript;

                if (event.results[0].isFinal) {
                    handleUserMessage(transcript);
                }
            };

            rec.onerror = (event) => {
                console.error('Speech error:', event.error);
                resetUI();
                statusText.textContent = 'Tap to try again';
            };

            rec.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                if (!statusText.classList.contains('thinking')) {
                    resetUI();
                }
            };

            return rec;
        }

        recognition = initSpeechRecognition();

        function handleUserMessage(text) {
            addMessage(text, 'user');
            
            statusText.textContent = 'Ollie is thinking...';
            statusText.className = 'status-text thinking';
            avatarCircle.className = 'avatar-circle thinking';
            thinkingDots.classList.add('active');
            waveContainer.classList.remove('active');

            // Simulate processing delay
            setTimeout(() => {
                const response = responses[Math.floor(Math.random() * responses.length)];
                ollieSpeak(response);
            }, 1500 + Math.random() * 1000);
        }

        function ollieSpeak(text) {
            thinkingDots.classList.remove('active');
            addMessage(text, 'ollie');
            
            statusText.textContent = 'Speaking...';
            statusText.className = 'status-text speaking';
            avatarCircle.className = 'avatar-circle speaking';
            waveContainer.classList.add('active');

            if (SpeechSynthesis) {
                SpeechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1;
                utterance.pitch = 1;
                utterance.lang = 'en-GB';
                
                const voices = SpeechSynthesis.getVoices();
                const preferredVoice = voices.find(v => 
                    v.name.includes('Google UK English Male') || 
                    v.name.includes('Daniel') ||
                    v.name.includes('British')
                );
                if (preferredVoice) utterance.voice = preferredVoice;

                utterance.onend = () => {
                    resetUI();
                };

                SpeechSynthesis.speak(utterance);
            } else {
                setTimeout(resetUI, 3000);
            }
        }

        function addMessage(text, sender) {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${sender}`;
            bubble.textContent = text;
            conversation.appendChild(bubble);
            conversation.scrollTop = conversation.scrollHeight;
        }

        function resetUI() {
            micBtn.classList.remove('listening');
            avatarCircle.className = 'avatar-circle';
            statusText.className = 'status-text';
            statusText.textContent = 'Tap microphone to talk';
            waveContainer.classList.remove('active');
            thinkingDots.classList.remove('active');
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) {
                statusText.textContent = 'Speech API not available. Use text input.';
                return;
            }
            
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition = initSpeechRecognition();
                    recognition.start();
                }
            }
        });

        textBtn.addEventListener('click', () => {
            textModal.classList.toggle('active');
            if (textModal.classList.contains('active')) {
                textInput.focus();
            }
        });

        function sendTextMessage() {
            const text = textInput.value.trim();
            if (!text) return;
            
            handleUserMessage(text);
            textInput.value = '';
            textModal.classList.remove('active');
        }

        sendBtn.addEventListener('click', sendTextMessage);
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        // Animate wave bars
        setInterval(() => {
            if (waveContainer.classList.contains('active')) {
                document.querySelectorAll('.wave-bar').forEach(bar => {
                    bar.style.height = (10 + Math.random() * 30) + 'px';
                });
            }
        }, 100);

        // Blink eyes
        setInterval(() => {
            document.querySelectorAll('.eye').forEach(eye => {
                eye.style.transform = 'scaleY(0.1)';
                setTimeout(() => {
                    eye.style.transform = 'scaleY(1)';
                }, 150);
            });
        }, 4000);

        if (SpeechSynthesis) {
            SpeechSynthesis.onvoiceschanged = () => {
                console.log('Voices loaded:', SpeechSynthesis.getVoices().length);
            };
        }
    </script>
</body>
</html>
