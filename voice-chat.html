<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollie Voice Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            transition: all 0.3s;
        }
        .avatar.speaking {
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            animation: pulse 0.8s ease-in-out infinite alternate;
        }
        .avatar.listening {
            border-color: #4ade80;
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.3);
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        .status {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            min-height: 20px;
        }
        .transcript {
            font-size: 18px;
            text-align: center;
            min-height: 60px;
            color: #fff;
            line-height: 1.4;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #1a1a2e;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }
        .mic-btn:hover { transform: scale(1.05); }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.listening {
            background: #ff4444;
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.4);
            animation: micPulse 1s ease-in-out infinite;
        }
        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar" id="avatar">🦉</div>
        <div class="status" id="status">Press and hold to speak</div>
        <div class="transcript" id="transcript"></div>
        <button class="mic-btn" id="micBtn">🎤</button>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        
        const avatar = document.getElementById('avatar');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const micBtn = document.getElementById('micBtn');
        
        let recognition = null;
        let isListening = false;
        
        const responses = [
            "I've been reviewing our priorities. What's the most urgent item on your list?",
            "Good point. Let me think through the implications of that...",
            "From a strategic perspective, that aligns well with the £10M goal.",
            "Have you considered the compliance angle on this?",
            "That's exactly the kind of thinking that moves the needle.",
            "Want me to dig into the numbers on that?",
            "Smart. Let's keep that in the active pipeline.",
            "I like where this is heading. What's the next step?",
            "Let me flag that for our next review session.",
            "That's a solid approach. No fluff, just execution."
        ];

        function initSpeech() {
            const rec = new SpeechRecognition();
            rec.continuous = false;
            rec.interimResults = true;
            rec.lang = 'en-GB';
            
            rec.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                avatar.className = 'avatar listening';
                status.textContent = 'Listening...';
                transcript.textContent = '';
            };
            
            rec.onresult = (event) => {
                const text = Array.from(event.results).map(r => r[0].transcript).join('');
                transcript.textContent = text;
                if (event.results[0].isFinal) {
                    handleInput(text);
                }
            };
            
            rec.onerror = (e) => {
                status.textContent = 'Error: ' + e.error;
                resetState();
            };
            
            rec.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                if (!isSpeaking) resetState();
            };
            
            return rec;
        }

        if (SpeechRecognition) {
            recognition = initSpeech();
        } else {
            status.textContent = 'Speech not supported';
            micBtn.style.display = 'none';
        }

        let isSpeaking = false;

        function handleInput(text) {
            avatar.className = 'avatar';
            status.textContent = 'Thinking...';
            
            setTimeout(() => {
                const response = responses[Math.floor(Math.random() * responses.length)];
                speak(response);
            }, 1000 + Math.random() * 1000);
        }

        function speak(text) {
            isSpeaking = true;
            avatar.className = 'avatar speaking';
            status.textContent = 'Speaking...';
            transcript.textContent = text;
            
            if (synth) {
                synth.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.95;
                u.pitch = 1;
                u.lang = 'en-GB';
                u.onend = () => {
                    isSpeaking = false;
                    resetState();
                };
                synth.speak(u);
            } else {
                setTimeout(resetState, 3000);
            }
        }

        function resetState() {
            avatar.className = 'avatar';
            status.textContent = 'Press and hold to speak';
            transcript.textContent = '';
        }

        micBtn.addEventListener('mousedown', () => {
            if (!recognition || isSpeaking) return;
            try { recognition.start(); } catch(e) {
                recognition = initSpeech();
                recognition.start();
            }
        });

        micBtn.addEventListener('mouseup', () => {
            if (!recognition) return;
            try { recognition.stop(); } catch(e) {}
        });

        micBtn.addEventListener('mouseleave', () => {
            if (!recognition || !isListening) return;
            try { recognition.stop(); } catch(e) {}
        });

        // Touch events
        micBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!recognition || isSpeaking) return;
            try { recognition.start(); } catch(e) {
                recognition = initSpeech();
                recognition.start();
            }
        });

        micBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!recognition) return;
            try { recognition.stop(); } catch(e) {}
        });

        // Welcome
        setTimeout(() => speak("Hey Bass, I'm Ollie. Press and hold the microphone to talk to me."), 500);
    </script>
</body>
</html>
